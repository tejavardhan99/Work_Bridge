services:
  - type: web
    name: workbridge-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn workbridge.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: workbridge.settings
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_FILE
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
