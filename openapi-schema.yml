components:
  schemas:
    ApplicationDecisionRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ApplicationDecisionStatusEnum'
      required:
      - status
    ApplicationDecisionStatusEnum:
      enum:
      - accepted
      - rejected
      type: string
      description: |-
        * `accepted` - accepted
        * `rejected` - rejected
    ApplicationRequest:
      type: object
      properties:
        cover_note:
          type: string
    AuthIndex:
      type: object
      properties:
        worker_register:
          type: string
        worker_login:
          type: string
        employer_register:
          type: string
        employer_login:
          type: string
        admin_login:
          type: string
        refresh:
          type: string
        demo_tokens:
          type: string
        note:
          type: string
      required:
      - admin_login
      - demo_tokens
      - employer_login
      - employer_register
      - note
      - refresh
      - worker_login
      - worker_register
    AvailabilityRequest:
      type: object
      properties:
        availability:
          type: boolean
      required:
      - availability
    BlockUserRequest:
      type: object
      properties:
        is_blocked:
          type: boolean
      required:
      - is_blocked
    CertificateUploadRequest:
      type: object
      properties:
        certificates:
          type: array
          items:
            type: string
            format: binary
    ChannelEnum:
      enum:
      - phone
      - email
      type: string
      description: |-
        * `phone` - phone
        * `email` - email
    ComplaintStatusStatusEnum:
      enum:
      - open
      - reviewing
      - resolved
      - dismissed
      type: string
      description: |-
        * `open` - open
        * `reviewing` - reviewing
        * `resolved` - resolved
        * `dismissed` - dismissed
    DemoTokens:
      type: object
      properties:
        worker:
          type: object
          additionalProperties: {}
        employer:
          type: object
          additionalProperties: {}
        admin:
          type: object
          additionalProperties: {}
      required:
      - admin
      - employer
      - worker
    EmployerProfileRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        phone:
          type: string
        email:
          type: string
          format: email
        organization_name:
          type: string
          maxLength: 160
        business_type:
          type: string
          maxLength: 120
        location:
          $ref: '#/components/schemas/LocationRequest'
    FraudReportRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
        details:
          type: string
        reported_user_id:
          type: string
        job_id:
          type: string
      required:
      - reason
    HealthResponse:
      type: object
      properties:
        service:
          type: string
        status:
          type: string
        database:
          type: object
          additionalProperties: {}
      required:
      - database
      - service
      - status
    JobRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          minLength: 1
        required_skills:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 80
        salary:
          type: number
          format: double
          minimum: 0
        location:
          $ref: '#/components/schemas/LocationRequest'
        duration:
          type: string
          minLength: 1
          maxLength: 80
        urgency:
          allOf:
          - $ref: '#/components/schemas/UrgencyEnum'
          default: normal
        worker_level_required:
          allOf:
          - $ref: '#/components/schemas/WorkerLevelRequiredEnum'
          default: Beginner
      required:
      - description
      - duration
      - location
      - required_skills
      - salary
      - title
    LocationRequest:
      type: object
      properties:
        address:
          type: string
        village:
          type: string
        district:
          type: string
        state:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
      required:
      - latitude
      - longitude
    Login:
      type: object
      properties:
        identifier:
          type: string
      required:
      - identifier
    LoginRequest:
      type: object
      properties:
        identifier:
          type: string
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - identifier
      - password
    NeedWorkTodayRequest:
      type: object
      properties:
        enabled:
          type: boolean
          default: true
    OTPStart:
      type: object
      properties:
        identifier:
          type: string
        channel:
          $ref: '#/components/schemas/ChannelEnum'
      required:
      - channel
      - identifier
    OTPStartRequest:
      type: object
      properties:
        identifier:
          type: string
          minLength: 1
        channel:
          $ref: '#/components/schemas/ChannelEnum'
      required:
      - channel
      - identifier
    OTPVerify:
      type: object
      properties:
        identifier:
          type: string
        otp:
          type: string
          maxLength: 8
      required:
      - identifier
      - otp
    OTPVerifyRequest:
      type: object
      properties:
        identifier:
          type: string
          minLength: 1
        otp:
          type: string
          minLength: 1
          maxLength: 8
      required:
      - identifier
      - otp
    PatchedAvailabilityRequest:
      type: object
      properties:
        availability:
          type: boolean
    PatchedBlockUserRequest:
      type: object
      properties:
        is_blocked:
          type: boolean
    PatchedComplaintStatusRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ComplaintStatusStatusEnum'
    PatchedEmployerProfileRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        phone:
          type: string
        email:
          type: string
          format: email
        organization_name:
          type: string
          maxLength: 160
        business_type:
          type: string
          maxLength: 120
        location:
          $ref: '#/components/schemas/LocationRequest'
    PatchedJobRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          minLength: 1
        required_skills:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 80
        salary:
          type: number
          format: double
          minimum: 0
        location:
          $ref: '#/components/schemas/LocationRequest'
        duration:
          type: string
          minLength: 1
          maxLength: 80
        urgency:
          allOf:
          - $ref: '#/components/schemas/UrgencyEnum'
          default: normal
        worker_level_required:
          allOf:
          - $ref: '#/components/schemas/WorkerLevelRequiredEnum'
          default: Beginner
    PatchedWorkerProfileRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          type: string
        email:
          type: string
          format: email
        location:
          $ref: '#/components/schemas/LocationRequest'
        skills:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 80
        languages:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 50
        availability:
          type: boolean
        experience:
          type: string
        profile_image:
          type: string
          format: binary
        certificates:
          type: array
          items:
            type: string
            format: binary
    Refresh:
      type: object
      properties:
        refresh:
          type: string
      required:
      - refresh
    RefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    Register:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        phone:
          type: string
        email:
          type: string
          format: email
      required:
      - name
    RegisterRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - name
      - password
    ReviewRequest:
      type: object
      properties:
        rating:
          type: integer
          maximum: 5
          minimum: 1
        comment:
          type: string
      required:
      - rating
    UrgencyEnum:
      enum:
      - normal
      - urgent
      - emergency
      type: string
      description: |-
        * `normal` - normal
        * `urgent` - urgent
        * `emergency` - emergency
    WorkerLevelRequiredEnum:
      enum:
      - Beginner
      - Intermediate
      - Senior
      type: string
      description: |-
        * `Beginner` - Beginner
        * `Intermediate` - Intermediate
        * `Senior` - Senior
    WorkerProfileRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          type: string
        email:
          type: string
          format: email
        location:
          $ref: '#/components/schemas/LocationRequest'
        skills:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 80
        languages:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 50
        availability:
          type: boolean
        experience:
          type: string
        profile_image:
          type: string
          format: binary
        certificates:
          type: array
          items:
            type: string
            format: binary
    WorkerRatingRequest:
      type: object
      properties:
        job_id:
          type: string
          minLength: 1
        rating:
          type: integer
          maximum: 5
          minimum: 1
        comment:
          type: string
      required:
      - job_id
      - rating
    WorkerSkillsRequest:
      type: object
      properties:
        skills:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 80
      required:
      - skills
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
